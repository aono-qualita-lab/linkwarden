services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    restart: always
    mem_limit: 512m
    cpus: 0.25
    volumes:
      - ./pgdata:/var/lib/postgresql/data
  linkwarden:
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
    restart: always
    mem_limit: 1g
    cpus: 0.5
    # build: . # uncomment to build from source
    image: ghcr.io/linkwarden/linkwarden:latest # comment to build from source
    ports:
      - 3001:3000
    volumes:
      - ./data:/data/data
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/v1/health', (r) => { if (r.statusCode === 200) process.exit(0); else process.exit(1); })\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
